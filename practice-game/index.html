<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Free Online Billiards, Pool &amp; Snooker Game</title>
    <style>
      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url("fonts/exo-200.ttf")
          format("truetype");
      }

      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("fonts/exo-600.ttf")
          format("truetype");
      }

      .about-more {
        position: fixed;
        inset: 0;
        z-index: 500;
        pointer-events: none;
      }

      .about-more summary {
        position: absolute;
        left: 50%;
        bottom: 1px;
        padding: 1px 5px;
        color: #b0b0b0;
        font-size: 8px;
        line-height: 1;
        list-style: none;
        cursor: pointer;
        transform: translateX(-50%);
        pointer-events: auto;
      }

      .about-more summary::-webkit-details-marker {
        display: none;
      }

      .about-more[open] summary {
        inset: 0;
        font-size: 0;
        background: rgb(0 0 0 / 40%);
        cursor: default;
        transform: none;
      }

      body.chromeless .about-more {
        display: none;
      }

      .about-more .about-panel {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(38rem, calc(100vw - 1rem));
        max-height: min(72vh, 42rem);
        overflow-y: auto;
        scrollbar-width: none;

        /* index.css sets `div { touch-action: none }` to keep table drags off
           the page; without this the panel only wheels, never finger-scrolls. */
        touch-action: pan-y;
        padding: 10px 12px;
        background: #000;
        color: #e0e0e0;
        font-family: var(--font-family-primary, sans-serif);
        transform: translate(-50%, -50%);
        pointer-events: auto;
      }

      .about-more .about-panel a {
        color: #8ab6f8;
      }
    </style>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta
      name="description"
      content="Play free online pool, billiards and snooker with realistic 3D physics. Try 8-ball, 9-ball, three-cushion carom and practice challenges in your browser. No download or account required."
    />
    <meta
      name="keywords"
      content="billiards, billiards simulator, online billiards, free billiards game, pool game, snooker game, 8-ball, 9-ball, three-cushion billiards, three cushion carom, carom billiards, 4-ball billiards, open source billiards, ビリヤード, ビリヤードゲーム, 無料ビリヤード, 3クッション, スリークッション, 9ボール, 당구, 무료 당구, 온라인 당구, 당구 게임, 3쿠션, 사구, 스누커, Bida 3 băng, bi-a 3 băng, Biliar 3 bandas, billar a tres bandas, billar de carambolas, jugar billar carambolas, billar online gratis, Üç bant bilardo, üç bant, driebanden, biljart, gratis biljart, biljart spel, Carom3D, ShootersPool"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="stylesheet" type="text/css" href="css/fonts.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/index.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/aiminputs.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/powerinput.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/notification.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/tray.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/chat.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/lobby.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/menu.css?v=1.1.1" />
    <link rel="stylesheet" type="text/css" href="css/wood.css?v=1.1.1" />
  </head>

  <body>

    <main>
      <div id="viewP1" class="view3d">
        <div id="snookerScoreOverlay">
          <div id="snookerScore" aria-live="polite">
            <div id="breakScore" class="breakScore"></div>
          </div>
        </div>
        <div id="notificationOverlay">
          <div id="notification" aria-live="assertive" role="alert"></div>
        </div>
        <div id="helpOverlay" hidden>
          <iframe title="Help"></iframe>
          <div class="help-footer">
            <button id="helpClose" type="button">close</button>
          </div>
        </div>
        <div id="botDebugOverlay">
          <header>
            <span id="botDebugToggle">🦞</span>
            <div>
              <button
                id="botDebugClear"
                type="button"
                aria-label="Clear debug log"
              >
                Clear
              </button>
            </div>
          </header>
          <pre id="botDebugLog" aria-live="polite">
          <img
            src="images/billiards.png"
            loading="lazy"
            alt="Billiards Pool Game Promo - Realistic Physics Simulation"
          />
        </pre>
        </div>
        <div class="chatarea">
          <div id="chatoutput" class="chatoutput"></div>
        </div>
        <dialog id="inputTextDiv" contenteditable="false">
          <div id="inputTextDivInner">
            <input
              id="inputText"
              type="text"
              placeholder="Enter text here..."
              maxlength="64"
              autofocus
              autocomplete="off"
              aria-label="Chat message input"
            />
            <div
              id="chatEmojiList"
              role="group"
              aria-label="Emoji messages"
            ></div>
            <button id="inputSend" type="button" aria-label="Send chat message">
              ➤
            </button>
            <button
              id="toggleChatMode"
              type="button"
              aria-label="Switch to emoji mode"
            >
              <span class="chat-text-mode-icon">👾</span>
              <span class="chat-emoji-mode-icon">⌨️</span>
            </button>
            <button id="inputClose" type="button" aria-label="Close chat input">
              ✖
            </button>
          </div>
        </dialog>
      </div>
      <div id="panel" class="panel wood-texture">
        <div class="aimControlColumn">
          <div class="aimingArea">
            <button
              class="hitButton timeout-btn"
              id="cueHit"
              type="button"
              aria-label="Hit cue ball"
            >
              hit
            </button>
          </div>
          <div id="tiltSliderContainer" class="tiltSliderContainer" hidden>
            <angle-input
              id="cueTilt"
              role="slider"
              aria-label="tilt angle"
              aria-valuemin="0"
              aria-valuemax="72"
              aria-valuenow="0"
            ></angle-input>
          </div>
          <template id="angle-input-template">
            <div class="area" id="area">
              <div class="ball"></div>
              <div class="rotator" id="rot">
                <div class="stick">
                  <div class="tip"></div>
                  <div class="ferrule"></div>
                  <div class="shaft"></div>
                  <div class="butt"></div>
                </div>
              </div>
            </div>
          </template>
          <div id="ballContainerWrapper" class="ballContainerWrapper">
            <button id="openElevation" type="button" class="openElevation">
              +
            </button>
            <div id="ballContainer" class="ballContainer">
              <div id="objectBall" class="objectBall"></div>
              <div id="cueBall" class="cueBall">
                <div id="cueTip" class="cueTip"></div>
              </div>
            </div>
          </div>
        </div>
        <div id="powerSliderContainer" class="powerSliderContainer">
          <div class="power-track"></div>
          <input
            class="powerSlider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.65"
            id="cuePower"
            aria-label="power slider"
          />
          <span id="powerPercent" class="powerPercent">65%</span>
        </div>
        <div class="outerMenu">
          <details id="menuDropdown" class="menuDropdown">
            <summary
              class="menuButton half-height"
              title="menu"
              id="menu"
              aria-label="Menu"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#000"
                stroke-width="2"
              >
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </summary>
            <div id="menuItems" class="menuItems">
              <button
                class="menuButton half-height"
                title="comment"
                id="comment"
                type="button"
                aria-label="Comment"
                hidden
              >
                🗨
              </button>
              <button
                class="menuButton half-height"
                title="diagram"
                id="diagram"
                type="button"
                aria-label="Diagram"
                hidden
              >
                📸
              </button>
              <button
                class="menuButton half-height"
                title="fullscreen"
                id="fullscreen"
                type="button"
                aria-label="Fullscreen"
              >
                ⛶
              </button>
              <button
                class="menuButton half-height"
                title="fast forward"
                id="ffwd"
                type="button"
                aria-label="Fast forward"
                hidden
              >
                ⏩︎
              </button>
              <button
                class="menuButton half-height"
                title="share"
                id="share"
                type="button"
                aria-label="Share replay link"
                hidden
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
              </button>
              <button
                class="menuButton half-height"
                title="concede"
                id="concede"
                type="button"
                aria-label="Concede"
                hidden
              >
                🏳️
              </button>
              <button
                class="menuButton half-height"
                title="shot analysis"
                id="analysis"
                type="button"
                aria-label="Shot analysis"
                hidden
              >
                🔍
              </button>
              <button
                class="menuButton half-height"
                title="chromeless (L)"
                id="chromeless"
                type="button"
                aria-label="Toggle chromeless mode"
              >
                👁︎
              </button>
              <button
                class="menuButton half-height"
                title="help"
                id="help"
                type="button"
                aria-label="Help"
              >
                𝑖
              </button>
            </div>
          </details>
          <canvas id="minimap" width="252" height="136" hidden>
            Table minimap
          </canvas>
          <button
            class="menuButton aim"
            title="view"
            id="camera"
            type="button"
            aria-label="Toggle camera view"
          >
            🎥
          </button>
        </div>
      </div>

      <div
        id="ballTray"
        class="tray-container"
        aria-live="polite"
        role="log"
        hidden
      >
        <div class="nav-btn btn-left" id="trayLeft">❮</div>
        <div class="ball-tray-list" id="ballTrayList"></div>
        <div class="nav-btn btn-right" id="trayRight">❯</div>
      </div>
      <div id="trayTimer" class="tray-timer" hidden></div>
      <div class="tray-score-container">
        <div id="p1Score" class="p1Score"></div>
        <div id="p2Score" class="p2Score"></div>
      </div>
      <div id="lobbyContainer">
        <div class="challenge-row">
          <span id="challengePill" class="challenge-pill" hidden>
            <button
              id="challengeAccept"
              type="button"
              aria-label="Accept challenge"
            >
              ✅
            </button>
            <button
              id="challengeDecline"
              type="button"
              aria-label="Decline challenge"
            >
              ❌
            </button>
          </span>
          <span class="challenge-vs" aria-hidden="true">⚔</span>
        </div>
        <span class="pill" id="lobbyOverlay" hidden style="display:none"><span class="lobby-count"></span></span>
      </div>
    </main>
    <script defer src="three_core.js?v=1.1.1"></script>
    <script defer src="three_module.js?v=1.1.1"></script>
    <script defer src="three_examples.js?v=1.1.1"></script>
    <script defer src="messaging.js?v=1.1.1"></script>
    <script defer src="index.js?v=1.1.1"></script>
  </body>
</html>
