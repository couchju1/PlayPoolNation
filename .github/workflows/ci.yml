name: Build and check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds every page, writes _redirects, then fails on duplicate titles or H1s,
      # broken links, sitemap URLs that are noindex, and pages without one H1.
      - run: npm run build
      - run: python3 -m unittest discover tools/enrich/tests
