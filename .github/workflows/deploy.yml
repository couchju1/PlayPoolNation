# Builds the site and commits the result to the `deploy` branch. Hostinger's Git
# deployment (hPanel → Advanced → Git) pulls that branch into public_html for
# playpoolnation.com, either from its webhook or the Deploy button.
# The branch only ever moves forward (no force-push), so Hostinger's pull always works.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit the built site to the deploy branch
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch --depth=1 origin deploy
            git worktree add ../site deploy
          else
            git worktree add --orphan -b deploy ../site
          fi
          # Replace everything with the new build, keeping the worktree's .git file.
          find ../site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. ../site/
          cd ../site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -q -m "Build ${SHA::7}"
            git push origin deploy
          fi
