# Builds the site and uploads it to Cloudflare Pages (project "playpoolnation").
# Pushes to main go live at playpoolnation.pages.dev (and playpoolnation.com once
# the domain is attached); pull requests get a preview URL.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit).
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork pull requests can't read the secret; skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ec40776b8b72ddcea8da4a57339fb43
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name playpoolnation --branch "${{ github.head_ref || github.ref_name }}" --commit-hash "${{ github.sha }}"
